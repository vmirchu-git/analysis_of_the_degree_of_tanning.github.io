<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="#14131a"/>

  <text x="600" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">QUANTIFYING INTENT DUPLICATION</text>
  <text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">from skepticism to a funded merge initiative</text>

  <!-- Box 1 -->
  <rect x="55" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="180" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Sample-based</text>
  <text x="180" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">measurement</text>
  <text x="180" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">representative sample,</text>
  <text x="180" y="181" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">largest chatbot channel</text>

  <!-- Box 2 -->
  <rect x="335" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="460" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Statistical validation</text>
  <text x="460" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">quantify duplication rate,</text>
  <text x="460" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">joint review with NLP team</text>

  <!-- Box 3 -->
  <rect x="615" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="740" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Business case</text>
  <text x="740" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">converted initial skepticism</text>
  <text x="740" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">into leadership buy-in</text>

  <!-- Box 4 -->
  <rect x="895" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="1020" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Merge &amp; verify</text>
  <text x="1020" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">ongoing initiative,</text>
  <text x="1020" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">accuracy impact confirmed</text>

  <!-- Arrows -->
  <line x1="305" y1="145" x2="333" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="145" x2="613" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="145" x2="893" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="60" y1="222" x2="1140" y2="222" stroke="#3a3840" stroke-width="1"/>

  <!-- Stat callouts -->
  <text x="300" y="264" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#c9a227" text-anchor="middle">&gt;50%</text>
  <text x="300" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">of production intents were duplicates</text>

  <text x="900" y="264" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a227" text-anchor="middle">ongoing</text>
  <text x="900" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">merge initiative, verified impact</text>
</svg>
